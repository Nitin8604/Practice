name: Smart Dispatcher

on:
  workflow_dispatch:
    inputs:
      risk_level:
        description: "Select the risk level"
        required: true
        type: choice
        options:
          - low
          - medium
          - high
          - critical
        default: low

      notify:
        description: "Notify the on-call engineer"
        required: true
        type: boolean
        default: false

      dry_run:
        description: "Run in dry-run mode"
        required: true
        type: boolean
        default: false

      owner:
        description: "Owner name"
        required: true
        type: string

      components:
        description: "Comma-separated components"
        required: true
        type: string

run-name: >-
  ${{ format(
    '{0} | {1} | {2}',
    inputs.risk_level == 'low' && 'LOW' ||
    inputs.risk_level == 'medium' && 'MEDIUM' ||
    inputs.risk_level == 'high' && 'HIGH' ||
    'CRITICAL',
    inputs.owner,
    inputs.dry_run && 'DRY-RUN' || ''
  ) }}

jobs:

  classify:
    runs-on: ubuntu-latest

    steps:
      - name: Print components
        run: echo "Components: ${{ inputs.components }}"

      - name: Check database
        run: echo "Database mentioned: ${{ contains(inputs.components, 'database') }}"

      - name: Check auth
        run: echo "Auth mentioned: ${{ contains(inputs.components, 'auth') }}"

      - name: Check startsWith and endsWith
        run: |
          echo "Owner starts with capital A: ${{ startsWith(inputs.owner, 'A') }}"
          echo "Components ends with comma: ${{ endsWith(inputs.components, ',') }}"

      - name: Natural format sentence
        run: |
          echo "${{ format('Risk level is {0}, owner is {1}, and components are {2}.', inputs.risk_level, inputs.owner, inputs.components) }}"

  gate:
    needs: classify
    runs-on: ubuntu-latest

    steps:
      - name: High or critical database
        if: ${{ (inputs.risk_level == 'high' || inputs.risk_level == 'critical') && contains(inputs.components, 'database') }}
        run: echo "Gate 1 satisfied: high/critical risk with database component."

      - name: Critical or notify
        if: ${{ inputs.risk_level == 'critical' || inputs.notify }}
        run: echo "Gate 2 satisfied: critical risk or notify is enabled."

      - name: Non-low and not dry-run
        if: ${{ !inputs.dry_run && inputs.risk_level != 'low' }}
        run: echo "Gate 3 satisfied: risk is not low and dry_run is disabled."

  execute:
    needs: gate
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Step A - Force failure during dry-run
        if: ${{ inputs.dry_run }}
        run: |
          echo "Dry run detected. Forcing a failure."
          exit 1

      - name: Step B - Dry run stopped
        if: ${{ failure() }}
        run: echo "Dry run stopped before execution"

      - name: Step C - Execution proceeded
        if: ${{ success() && !failure() }}
        run: echo "Execution proceeded"

      - name: Step D - Execution summary
        if: ${{ always() }}
        run: |
          echo "Gate result: ${{ needs.gate.result }}"
          echo "Execute job status: ${{ job.status }}"

  close:
    needs:
      - classify
      - gate
      - execute
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Closing summary
        run: |
          echo "${{ format('Risk: {0}, Owner: {1}, Dry run: {2} — CLOSED', inputs.risk_level, inputs.owner, inputs.dry_run) }}"

      - name: Dispatcher closed
        run: echo "Dispatcher closed"